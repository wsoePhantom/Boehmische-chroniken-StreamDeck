name: Build Stream Deck prototype
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build -w backend
      - run: npm run test -w backend
      - name: Validate live master-list parsing
        run: node -e 'import("./backend/dist/master-list.js").then(async m => { const listing = await m.fetchPublicListing(); if (!listing) throw new Error("Target server not parsed from live master list"); console.log(listing); })'
      - run: npm run build -w plugin
      - run: npx --yes esbuild plugin/src/plugin.ts --bundle --platform=node --format=cjs --target=node20 --outfile=build/de.boehmischechroniken.stats.sdPlugin/plugin.js
      - run: python -m pip install pillow
      - run: python scripts/assemble-plugin.py
      - name: Create installable Stream Deck archive
        run: |
          cd build
          zip -qr Boehmische-Chroniken.streamDeckPlugin de.boehmischechroniken.stats.sdPlugin
      - name: Validate plugin package
        run: python scripts/validate-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-prototype-unpacked
          path: |
            build/de.boehmischechroniken.stats.sdPlugin/
            build/Boehmische-Chroniken.streamDeckPlugin
