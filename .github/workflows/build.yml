name: Test standalone Stream Deck plugin
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build -w plugin
      - run: npx esbuild plugin/src/plugin.ts --bundle --platform=node --format=cjs --target=node20 --outfile=build/de.boehmischechroniken.stats.sdPlugin/plugin.js
      - run: python -m pip install pillow
      - run: python scripts/assemble-plugin.py
      - name: Create installable Stream Deck archive
        run: |
          cd build
          zip -qr Boehmische-Chroniken.streamDeckPlugin de.boehmischechroniken.stats.sdPlugin
      - name: Validate plugin package
        run: python scripts/validate-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-standalone-1.0.0
          path: |
            build/de.boehmischechroniken.stats.sdPlugin/
            build/Boehmische-Chroniken.streamDeckPlugin
