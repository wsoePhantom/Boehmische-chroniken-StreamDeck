services:
  stats-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PORT: "3100"
      STATS_API_KEY: "${STATS_API_KEY:?Set STATS_API_KEY in your environment}"
      STATS_DATA_FILE: /data/stats.json
    volumes:
      - stats-data:/data
volumes:
  stats-data:
