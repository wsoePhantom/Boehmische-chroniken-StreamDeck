<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Böhmische Chroniken – Einstellungen</title>
<style>body{font:13px system-ui;background:#202020;color:#eee;padding:12px}label{display:block;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:8px;background:#333;border:1px solid #555;border-radius:4px;color:white}small{display:block;color:#aaa;margin-top:8px}</style>
</head>
<body>
<label for="base">Statistik-API (Basis-URL)</label>
<input id="base" type="url" placeholder="http://127.0.0.1:3100/">
<label for="key">API-Schlüssel</label>
<input id="key" type="password" autocomplete="off">
<small>Die API muss vom Stream-Deck-Rechner aus erreichbar sein. Der Schlüssel wird in den Aktionseinstellungen gespeichert.</small>
<script>
let websocket, context, settings = {};
const base = document.getElementById("base");
const key = document.getElementById("key");
function save() {
  settings.apiBase = base.value.trim();
  settings.apiKey = key.value;
  if (websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
}
base.addEventListener("change", save);
key.addEventListener("change", save);
window.connectElgatoStreamDeckSocket = function(port, uuid, registerEvent, info, actionInfo) {
  context = uuid;
  try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch {}
  base.value = settings.apiBase || "";
  key.value = settings.apiKey || "";
  websocket = new WebSocket("ws://127.0.0.1:" + port);
  websocket.onopen = () => websocket.send(JSON.stringify({ event: registerEvent, uuid }));
  websocket.onmessage = ev => {
    const message = JSON.parse(ev.data);
    if (message.event === "didReceiveSettings") {
      settings = message.payload.settings || {};
      base.value = settings.apiBase || "";
      key.value = settings.apiKey || "";
    }
  };
};
</script></body></html>
